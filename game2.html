<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도서관 이용 교육 - KDC 책 꽂기 분류 게임</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --correct: #16a34a;
      --wrong: #dc2626;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 960px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 28px;
      border: 1px solid #e2e8f0;
    }

    .hidden { display: none !important; }

    /* 시작 화면 */
    .start-screen, .result-screen {
      text-align: center;
      padding: 24px 16px;
    }

    .start-screen h1 {
      font-size: 1.9rem;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .start-screen p {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .mode-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-mode {
      padding: 18px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      border: 2px solid var(--primary);
      cursor: pointer;
      transition: all 0.15s;
      min-width: 230px;
    }

    .btn-basic {
      background: var(--primary);
      color: #fff;
    }
    .btn-basic:hover { background: var(--primary-dark); }

    .btn-advanced {
      background: #fff;
      color: var(--primary);
    }
    .btn-advanced:hover { background: #eff6ff; }

    .kdc-guide {
      margin-top: 30px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      text-align: left;
    }

    .kdc-guide h3 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 10px;
      text-align: center;
    }

    .kdc-mini-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .kdc-mini-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .kdc-mini-item {
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      text-align: center;
      font-weight: 600;
    }

    /* 상단 상태바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #f1f5f9;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progress-badge {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
    }

    .score-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    /* 책 카드 영역 */
    .book-stage {
      background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
      border: 2px solid #fde68a;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .book-label {
      display: inline-block;
      background: #f59e0b;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .book-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 8px;
      word-break: keep-all;
    }

    .book-hint {
      font-size: 0.98rem;
      color: #78350f;
    }

    /* 피드백 알림창 */
    .feedback-box {
      display: flex;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 1rem;
      line-height: 1.5;
      align-items: center;
      justify-content
